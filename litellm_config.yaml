model_list:
  # OpenRouter models
# The "anthropic/" prefix forces LiteLLM to use Anthropic-compatible API contract
  - model_name: openai/gpt-oss-120b:free
    litellm_params:
      model: anthropic/openai/gpt-oss-120b:free # "anthropic/" prefix ensures LiteLLM uses the correct contract
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api

  - model_name: nvidia/nemotron-3-super-120b-a12b:free
    litellm_params:
      model: anthropic/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api

  # LM Studio local models
  - model_name: qwen/qwen3.5-9b
    litellm_params:
      model: anthropic/qwen/qwen3.5-9b
      api_key: dummy
      api_base: http://localhost:1234  # Local LM Studio model endpoint
      # custom_llm_provider: openai